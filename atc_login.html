<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS-IEC | ATC Center Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            color: white;
            text-align: center;
        }
        h2 { margin-bottom: 5px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus { border-color: #38bdf8; outline: none; }
        button {
            background: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover { background: #1d4ed8; }
        #errorMsg { color: #f87171; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>ATC Center Login</h2>
        <p>KDS-IEC Authorized Partner Portal</p>
        
        <form id="loginForm">
            <input type="text" id="atcId" placeholder="ATC ID (jaise: ATC001)" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="loginBtn">Login to Dashboard</button>
        </form>
        
        <div id="errorMsg"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbypRMDzAnIT7X777dBnJGaO5tFk5kZuZeqGFj--ldAX1-0HYPWY66E2kfGxoyk4PZ2_/exec';

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = "Logging in...";
            loginBtn.disabled = true;

            let requestData = {
                action: "atcLogin",
                atcId: document.getElementById('atcId').value.trim(),
                password: document.getElementById('password').value.trim()
            };

            try {
                let response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(requestData)
                });
                
                let result = await response.json();
                
                if (result.status === "success") {
                    localStorage.setItem("atcId", document.getElementById('atcId').value.trim());
                    localStorage.setItem("centerName", result.centerName);
                    localStorage.setItem("walletBalance", result.walletBalance);
                    window.location.href = "dashboard.html";
                } else {
                    errorMsg.textContent = result.message;
                    loginBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Connection error. Kripya dobara koshish karein.";
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
