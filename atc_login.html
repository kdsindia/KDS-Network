<script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbypRMDzAnIT7X777dBnJGaO5tFk5kZuZeqGFj--ldAX1-0HYPWY66E2kfGxoyk4PZ2_/exec';

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = "Logging in...";
            loginBtn.disabled = true;

            let requestData = {
                action: "atcLogin",
                atcId: document.getElementById('atcId').value.trim(),
                password: document.getElementById('password').value.trim()
            };

            try {
                let response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(requestData)
                });
                
                let result = await response.json();
                
                if (result.status === "success") {
                    // Center ka naam aur balance browser me save kar lenge taaki dashboard par dikh sake
                    localStorage.setItem("centerName", result.centerName);
                    localStorage.setItem("walletBalance", result.walletBalance);
                    
                    // Seedha Dashboard par bhej denge
                    window.location.href = "dashboard.html";
                } else {
                    errorMsg.textContent = result.message;
                    loginBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Connection error. Kripya dobara koshish karein.";
                loginBtn.disabled = false;
            }
        });
    </script>
