<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS-IEC : ATC Management Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }
        .form-container {
            background: white;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #28a745;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background: #218838;
        }
        .note {
            font-size: 14px;
            color: #d9534f;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>KDS-IEC : ATC Management & Student Registration</h2>
    </div>

    <div class="form-container">
        <h3>Naya Student Admission Form</h3>
        <form id="atcForm">
            <label>ATC Center Code / Name:</label>
            <input type="text" id="atcCode" placeholder="Apna ATC Code dalein" required>

            <label>Student Ka Naam:</label>
            <input type="text" id="studentName" placeholder="Student ka pura naam" required>

            <label>Course Ka Naam:</label>
            <input type="text" id="courseName" placeholder="Course ka naam" required>

            <label>Mobile Number:</label>
            <input type="tel" id="mobile" placeholder="Mobile number" required>

            <button type="submit">Admission Submit Karein</button>
        </form>
        <p class="note">* Note: Form submit hone ke baad Certificate aapke (Admin) approval ke baad hi generate hoga aur aap Certificate Order ki request bhej sakenge.</p>
    </div>

    <script>
        // Google Apps Script Web App URL yahan enter karein jo Google Sheet se connect karega
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

        const form = document.getElementById('atcForm');
        form.addEventListener('submit', e => {
            e.preventDefault();
            let formData = {
                atcCode: document.getElementById('atcCode').value,
                studentName: document.getElementById('studentName').value,
                courseName: document.getElementById('courseName').value,
                mobile: document.getElementById('mobile').value,
                status: 'Pending Admin Approval'
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(formData) })
                .then(response => {
                    alert('Student Admission Successfully Submit Ho Gaya Hai! Admin Approval ke baad certificate process hoga.');
                    form.reset();
                })
                .catch(error => console.error('Error!', error.message));
        });
    </script>

</body>
</html>
