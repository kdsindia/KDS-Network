<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS-IEC : ATC Management Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }
        .form-container {
            background: white;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #28a745;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background: #218838;
        }
        .note {
            font-size: 14px;
            color: #d9534f;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>KDS-IEC : ATC Management & Student Registration</h2>
    </div>

    <div class="form-container">
        <h3>Naya Student Admission Form</h3>
        <form id="atcForm">
            <label>Student Ka Naam:</label>
            <input type="text" id="studentName" placeholder="Student ka pura naam" required>

            <label>Pita Ka Naam (Father Name):</label>
            <input type="text" id="fatherName" placeholder="Pita ka naam" required>

            <label>Course Ka Naam:</label>
            <input type="text" id="course" placeholder="Course ka naam" required>

            <label>Mobile Number:</label>
            <input type="tel" id="mobile" placeholder="Mobile number" required>

            <label>Address:</label>
            <textarea id="address" placeholder="Pura pata dalein" rows="3" required></textarea>

            <button type="submit">Admission Submit Karein</button>
        </form>
        <p class="note">* Note: Form submit hone ke baad data seedhe aapke Google Sheet ke 'Admissions' tab me save ho jayega.</p>
    </div>

    <script>
        // Aapka Google Apps Script Web App URL yahan set kar diya gaya hai
        const scriptURL = 'https://script.google.com/macros/s/AKfycbypRMDzAnIT7X777dBnJGaO5tFk5kZuZeqGFj--ldAX1-0HYPWY66E2kfGxoyk4PZ2_/exec';

        const form = document.getElementById('atcForm');
        form.addEventListener('submit', e => {
            e.preventDefault();
            
            let formData = {
                action: "addAdmission",
                studentName: document.getElementById('studentName').value,
                fatherName: document.getElementById('fatherName').value,
                course: document.getElementById('course').value,
                mobile: document.getElementById('mobile').value,
                address: document.getElementById('address').value
            };

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData) 
            })
            .then(response => {
                alert('Student Admission Successfully Submit Ho Gaya Hai!');
                form.reset();
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('Kuch error aayi hai, kripya dobara koshish karein.');
            });
        });
    </script>

</body>
</html>
